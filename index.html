<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Nayeli 🌻</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         ESCENA 1 - PORTADA
    ========================== -->

    <section id="portada" class="pantalla portada">

        <div class="contenido-portada">

            <div class="flores-superiores">
                🌻 🌻 🌻
            </div>

            <img
                src="images/hello-kitty.jpg"
                alt="Hello Kitty"
                class="hello-kitty"
            >

            <h1>
                Hola, Nayeli 💛
            </h1>

            <p class="subtitulo">
                Preparé algo especial para ti...
            </p>

            <button
                id="btnComenzar"
                class="boton-comenzar"
            >
                🌻 Comenzar
            </button>

        </div>

    </section>


    <!-- =========================
         ESCENA 2 - LA SEMILLA
    ========================== -->

    <section id="semilla" class="pantalla escena-semilla">

        <div class="contenido-semilla">

            <h2>
                Todo comienza con algo pequeño...
            </h2>

            <p class="texto-semilla">
                Algunas cosas hermosas necesitan tiempo para crecer.
            </p>


            <!-- SOL -->

            <div class="sol">
                ☀️
            </div>


            <!-- JARDÍN -->

            <div class="jardin">

                <div class="tierra"></div>

                <!-- SEMILLA -->

                <div class="semilla-planta">

                    <div class="semilla"></div>

                    <div class="tallo"></div>

                    <div class="hoja hoja-izquierda"></div>

                    <div class="hoja hoja-derecha"></div>

                    <div class="flor">

                        <div class="centro-flor">
                            🌻
                        </div>

                    </div>

                </div>

            </div>


            <p
                id="mensajeFlor"
                class="mensaje-flor"
            >
                Y poco a poco... comenzó a florecer. 🌻
            </p>


            <button
                id="btnRecuerdo"
                class="boton-siguiente"
            >
                💛 Continuar
            </button>

        </div>

    </section>


    <!-- JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
