<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Flores Amarillas 🌻</title>

    <!-- Conectamos nuestro archivo CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="contenedor">

        <div class="flor">
            🌻
        </div>

        <h1>
            Flores Amarillas
        </h1>

        <p class="subtitulo">
            Tengo algo especial para ti...
        </p>

        <button
            class="boton"
            onclick="abrirMensaje()"
        >
            🌻 Abrir mi regalo
        </button>

        <section
            class="mensaje"
            id="mensaje"
        >

            <h2>
                💌 Para ti
            </h2>

            <p>
                Hay pequeños detalles
                que pueden convertirse
                en grandes recuerdos.
            </p>

            <p>
                Y este pequeño espacio
                fue creado especialmente
                para guardar uno de ellos. 🌻
            </p>

            <p>
                <strong>
                    Espero que te guste. 💛
                </strong>
            </p>

        </section>

    </main>


    <!-- Conectamos nuestro archivo JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
